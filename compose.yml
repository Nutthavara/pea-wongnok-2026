services:
  postgres:
    image: postgres:17
    container_name: wongnok-all-in-one-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: Pe@devp00l
    ports:
      - "5532:5432"
    volumes:
      - wongnok-all-in-one-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.10-alpine
    container_name: wongnok-all-in-one-redis
    restart: always
    ports:
      - "6479:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: wongnok-all-in-one-keycloak
    restart: always
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      # เก็บข้อมูลของ embedded database (dev-file) ไว้
      - wongnok-all-in-one-keycloak-data:/opt/keycloak/data
      # snapshot ของ realm/client/client scopes/users สำหรับ --import-realm
      - ./keycloak/import:/opt/keycloak/data/import:ro

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: wongnok-all-in-one-api
    restart: always
    depends_on:
      - postgres
      - redis
      - keycloak
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_NAME: wongnok
      LOG_LEVEL: DEBUG
      LOG_FORMAT: json
      # Database (เชื่อมต่อผ่านชื่อ service ในเครือข่าย compose แทน localhost)
      POSTGRES_DSN: postgres://postgres:Pe@devp00l@postgres:5432?database=wongnok
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Keycloak
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: pea
      KEYCLOAK_CLIENT_ID: wongnok
      KEYCLOAK_CLIENT_SECRET: xnk6VY3EuwkX13Rys5HCMxfTtSpoHxpRjurzDkCiOlMJkJV5aFbtG8TmOACKWldpPpssMGWrEj4Y5wyeo6CSLH
      KEYCLOAK_REDIRECT_URL: http://localhost:8080/api/v1/auth/callback
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  wongnok-all-in-one-pgdata:
  wongnok-all-in-one-keycloak-data:
